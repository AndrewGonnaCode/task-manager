name: CI/CD Pipeline

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # Job 1: Lint and Format Check
  # lint:
  #   name: Lint Code
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       service: [task-service, notification-service]
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up Go
  #       uses: actions/setup-go@v5
  #       with:
  #         go-version: '1.24.2'

  #     - name: Install golangci-lint
  #       run: |
  #         curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.59.1

  #     - name: Run golangci-lint
  #       working-directory: ./services/${{ matrix.service }}
  #       run: golangci-lint run --timeout=5m || true

  #     - name: Check formatting
  #       working-directory: ./services/${{ matrix.service }}
  #       run: |
  #         if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
  #           echo "Go code is not formatted:"
  #           gofmt -s -l .
  #           exit 1
  #         fi

  # Job 2: Test Services
  test:
    name: Test Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [task-service, notification-service]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: ./services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: test_db
          DB_SSLMODE: disable
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || true

      - name: Display coverage
        working-directory: ./services/${{ matrix.service }}
        run: go tool cover -func=coverage.out || true

  # Job 3: Build Docker Images (locally, no registry push)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [task-service, notification-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: todo-${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          echo "Testing Docker image: todo-${{ matrix.service }}:${{ github.sha }}"
          docker images | grep todo-${{ matrix.service }}

  # Job 4: Deploy Services
  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_NAME=todo_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_PORT=5435

          # Service Ports
          TASK_SERVICE_PORT=8080

          # Kafka Configuration
          KAFKA_PORT=9092

          # Telegram Configuration
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}

          # Logging
          LOG_LEVEL=info
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and deploy with docker-compose
        run: |
          echo "Deploying to ${{ env.ENVIRONMENT }} environment..."
          docker-compose build
          docker-compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30
          docker-compose ps

      - name: Run health checks
        run: |
          echo "Running health checks..."

          # Check if task-service is responding
          max_retries=10
          retry=0
          while [ $retry -lt $max_retries ]; do
            if curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✓ Task service is healthy"
              break
            fi
            retry=$((retry + 1))
            echo "Waiting for task-service... ($retry/$max_retries)"
            sleep 3
          done

          if [ $retry -eq $max_retries ]; then
            echo "✗ Task service health check failed"
            docker-compose logs task-service
            exit 1
          fi

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."

          # Test task creation
          response=$(curl -s -X POST http://localhost:8080/api/v1/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"CI/CD Test Task","description":"Testing deployment pipeline"}')

          echo "Task creation response: $response"

          if echo "$response" | grep -q "Task created successfully"; then
            echo "✓ Task creation test passed"
          else
            echo "✗ Task creation test failed"
            exit 1
          fi

          # Test task retrieval
          response=$(curl -s http://localhost:8080/api/v1/tasks)
          echo "Task retrieval response: $response"

          if echo "$response" | grep -q "data"; then
            echo "✓ Task retrieval test passed"
          else
            echo "✗ Task retrieval test failed"
            exit 1
          fi

      - name: Display service logs
        if: always()
        run: |
          echo "=== Task Service Logs ==="
          docker-compose logs --tail=50 task-service
          echo ""
          echo "=== Notification Service Logs ==="
          docker-compose logs --tail=50 notification-service
          echo ""
          echo "=== Kafka Logs ==="
          docker-compose logs --tail=50 kafka

      - name: Send Telegram notification (Success)
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *Deployment Successful*%0A%0A*Environment:* \`${{ env.ENVIRONMENT }}\`%0A*Branch:* \`${{ env.BRANCH_NAME }}\`%0A*Commit:* \`${{ env.COMMIT_SHA }}\`%0A*Workflow:* ${{ github.workflow }}%0A*Repository:* ${{ github.repository }}%0A%0AAll services deployed and health checks passed!" || true

      - name: Send Telegram notification (Failure)
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Deployment Failed*%0A%0A*Environment:* \`${{ env.ENVIRONMENT }}\`%0A*Branch:* \`${{ env.BRANCH_NAME }}\`%0A*Commit:* \`${{ env.COMMIT_SHA }}\`%0A*Workflow:* ${{ github.workflow }}%0A*Repository:* ${{ github.repository }}%0A%0A[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true

      - name: Cleanup (on failure)
        if: failure()
        run: |
          echo "Cleaning up failed deployment..."
          docker-compose down
