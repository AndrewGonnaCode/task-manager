version: '3.8'

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-todo_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: todo_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: todo_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka Topic Initializer (runs once to create topics)
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: todo_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Creating Kafka topics...'

      # Create task-events topic with 3 partitions
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic task-events --replication-factor 1 --partitions 3

      echo 'Topics created successfully:'
      kafka-topics --bootstrap-server kafka:29092 --list

      echo 'Topic details:'
      kafka-topics --bootstrap-server kafka:29092 --describe --topic task-events
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: todo_kafka_ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network
  # Task Service (REST API + Kafka Producer)
  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: todo_task_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${TASK_SERVICE_PORT:-8080}:8080"
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-todo_db}
      DB_SSLMODE: disable

      # Server Configuration
      SERVER_PORT: 8080

      # Kafka Configuration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: task-events
      KAFKA_CLIENT_ID: task-service

      # Service Configuration
      SERVICE_NAME: task-service
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Notification Service (Kafka Consumer + Telegram Bot)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: todo_notification_service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      # Kafka Configuration
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: task-events
      KAFKA_GROUP_ID: notification-service-group
      KAFKA_CLIENT_ID: notification-service

      # Telegram Configuration
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Service Configuration
      SERVICE_NAME: notification-service
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - todo-network
